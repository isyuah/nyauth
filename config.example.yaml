# nyauth example configuration
# Copy to config.yaml and edit as needed

server:
  host: "0.0.0.0"
  port: 8080
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

database:
  driver: postgres
  dsn: "postgres://nyauth:nyauth@localhost:5432/nyauth?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

auth:
  issuer: "http://localhost:8080"
  access_token_ttl: 3600         # 1 hour (in seconds for config, converted internally)
  refresh_token_ttl: 2592000     # 30 days
  authorization_code_ttl: 300    # 5 minutes
  encryption_key: "change-me-in-production-32bytes!"  # 32 bytes for AES-256-GCM
  jwk:
    algorithm: RS256
    key_size: 2048
    rotation_interval: 720h      # 30 days

providers:
  github:
    type: github
    client_id: ""
    client_secret: ""
    scopes:
      - "user:email"
  google:
    type: google
    client_id: ""
    client_secret: ""
    scopes:
      - "openid"
      - "email"
      - "profile"

admin:
  username: admin
  password: changeme
  email: admin@example.com

web:
  enabled: true
  title: "nyauth"
  logo_url: ""

# Local development example. Never reuse these values in production.
environment: development
server:
  host: "0.0.0.0"
  port: 8080
  secure_cookie: false
  trusted_proxy_cidrs: []
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
database:
  driver: postgres
  dsn: "postgres://nyauth:local-dev-only@localhost:5432/nyauth?sslmode=disable"
redis:
  addr: "localhost:6379"
  password: ""
  db: 0
auth:
  issuer: "http://localhost:8080"
  access_token_ttl: 3600
  refresh_token_ttl: 2592000
  authorization_code_ttl: 300
  master_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  argon2_concurrency: 4
  jwk:
    algorithm: RS256
    key_size: 2048
    rotation_interval: 720h
providers: {}
admin:
  username: admin
  password: local-dev-only-admin
  email: admin@localhost
web:
  enabled: true
  title: "nyauth"
  logo_url: ""

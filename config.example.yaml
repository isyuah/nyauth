# Local development example. Never reuse these values in production.
environment: development
server:
  host: "0.0.0.0"
  port: 8080
  secure_cookie: false
  trusted_proxy_cidrs: []
  readiness_timeout: 3s
  shutdown_timeout: 30s
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
database:
  driver: postgres
  dsn: "postgres://nyauth_runtime:local-dev-only-runtime-postgres@localhost:5432/nyauth?sslmode=disable"
  runtime_role: nyauth_runtime
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m
  health_check_period: 1m
  connect_timeout: 5s
  statement_timeout: 15s
  tls:
    mode: disable
    root_ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    server_name: ""
redis:
  addr: "localhost:6379"
  username: ""
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 2
  max_idle_conns: 20
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  conn_max_idle_time: 30m
  conn_max_lifetime: 1h
  tls:
    enabled: false
    root_ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    server_name: ""
    insecure_skip_verify: false
auth:
  issuer: "http://localhost:8080"
  access_token_ttl: 3600
  refresh_token_ttl: 2592000
  authorization_code_ttl: 300
  master_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  argon2_concurrency: 4
  jwk:
    algorithm: RS256
    key_size: 2048
    rotation_interval: 720h
admin:
  username: admin
  email: admin@localhost
web:
  enabled: true
  title: "nyauth"
  logo_url: ""
# mail: 账户安全中心（密码重置、邮箱验证/变更、安全通知）依赖邮件发送。
# mail.* 不允许写在配置文件里，只能通过 NYAUTH_MAIL_* 环境变量配置：
#   NYAUTH_MAIL_ENABLED=true
#   NYAUTH_MAIL_FROM_ADDRESS=noreply@example.com
#   NYAUTH_MAIL_FROM_NAME=nyauth
#   NYAUTH_MAIL_PUBLIC_BASE_URL=http://localhost:8080   # 邮件里链接的基址；生产必须 HTTPS
#   NYAUTH_MAIL_SMTP_HOST=localhost
#   NYAUTH_MAIL_SMTP_PORT=1025                          # 默认 587
#   NYAUTH_MAIL_SMTP_USERNAME=
#   NYAUTH_MAIL_SMTP_PASSWORD=                          # 优先用 NYAUTH_MAIL_SMTP_PASSWORD_FILE
#   NYAUTH_MAIL_SMTP_TLS_MODE=plain                     # starttls（默认）/implicit/plain；生产禁止 plain
# 本地开发可配合 Mailpit（docker run -p 1025:1025 -p 8025:8025 axllent/mailpit）。
# 未启用 mail 时相关 API 返回明确错误，其余功能不受影响。
media:
  backend: local
  local:
    directory: "data/media"
  s3:
    endpoint: ""
    region: ""
    bucket: ""
    prefix: "nyauth"
    path_style: false
# S3 凭据只能通过 NYAUTH_MEDIA_S3_ACCESS_KEY_ID[_FILE]、
# NYAUTH_MEDIA_S3_SECRET_ACCESS_KEY[_FILE] 和可选 SESSION_TOKEN[_FILE] 注入。
audit:
  retention: 8760h
telemetry:
  # Prometheus remains enabled on the internal /metrics route.
  # OTLP is only the bootstrap fallback until the database state is activated or disabled.
  otlp:
    enabled: false
    endpoint: ""
    # Prefer NYAUTH_TELEMETRY_OTLP_AUTHORIZATION_FILE for collector credentials.
    authorization: ""
    export_interval: 30s
    timeout: 10s

environment: development
server:
  host: "0.0.0.0"
  port: 8080
  secure_cookie: false
  trusted_proxy_cidrs: []
  readiness_timeout: 3s
  shutdown_timeout: 30s
database:
  driver: postgres
  dsn: "postgres://nyauth_runtime:local-dev-only-runtime-postgres@postgres:5432/nyauth?sslmode=disable"
  runtime_role: nyauth_runtime
  max_conns: 25
  min_conns: 5
  connect_timeout: 5s
  statement_timeout: 15s
  tls:
    mode: disable
redis:
  addr: "redis:6379"
  password: "local-dev-only-redis"
  db: 0
  pool_size: 20
  min_idle_conns: 2
  max_idle_conns: 20
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  tls:
    enabled: false
auth:
  issuer: "http://localhost:8080"
  access_token_ttl: 3600
  refresh_token_ttl: 2592000
  authorization_code_ttl: 300
  master_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  argon2_concurrency: 4
  jwk:
    algorithm: RS256
    key_size: 2048
    rotation_interval: 720h
admin:
  username: admin
  email: admin@localhost
web:
  enabled: true
  title: "Nya"
audit:
  retention: 8760h
telemetry:
  otlp:
    enabled: false
    endpoint: ""
    authorization: ""
    export_interval: 30s
    timeout: 10s

services:
  nyauth-a:
    environment:
      NYAUTH_MAIL_SMTP_PASSWORD_FILE: /run/secrets/mail_smtp_password
    secrets:
      - mail_smtp_password
  nyauth-b:
    environment:
      NYAUTH_MAIL_SMTP_PASSWORD_FILE: /run/secrets/mail_smtp_password
    secrets:
      - mail_smtp_password

secrets:
  mail_smtp_password:
    file: "${NYAUTH_MAIL_SMTP_PASSWORD_FILE:?set NYAUTH_MAIL_SMTP_PASSWORD_FILE to the host SMTP password secret file}"
